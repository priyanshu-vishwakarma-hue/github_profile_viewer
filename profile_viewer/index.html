<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="main">
        <section class="card shell">
            <header class="firstdiv">
                <h1>GitHub Profile Viewer</h1>
                <p>Search any public GitHub username to see their profile summary.</p>
            </header>

            <form class="search" id="searchForm" novalidate>
                <label class="sr-only" for="input">GitHub username</label>
                <input type="text" id="input" placeholder="Enter username (e.g. torvalds)" autocomplete="off" required>
                <button id="search" type="submit">Search</button>
            </form>

            <p id="status" class="status" aria-live="polite"></p>

            <section class="seconddiv" id="result" aria-live="polite" aria-busy="false"></section>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
